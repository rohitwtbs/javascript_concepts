<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Dodge Game</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }

    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 24px;
      font-family: sans-serif;
      z-index: 10;
    }

    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 36px;
      color: white;
      text-align: center;
      z-index: 11;
      display: none;
    }

    #restartBtn {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="ui">Score: <span id="score">0</span></div>
  <div id="gameOver">
    <div>Game Over</div>
    <button id="restartBtn">Restart</button>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    const canvas = document.querySelector('#gameCanvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas });
    renderer.setSize(window.innerWidth, window.innerHeight);

    // Lighting
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 7.5);
    scene.add(light);

    // Player
    const playerGeo = new THREE.BoxGeometry(1, 1, 1);
    const playerMat = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
    const player = new THREE.Mesh(playerGeo, playerMat);
    player.position.z = -5;
    scene.add(player);

    // Obstacles
    const obstacles = [];
    function spawnObstacle() {
      const geo = new THREE.BoxGeometry(1, 1, 1);
      const mat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set((Math.random() - 0.5) * 10, 5, -5);
      scene.add(mesh);
      obstacles.push(mesh);
    }

    // Controls
    let moveLeft = false, moveRight = false;
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') moveLeft = true;
      if (e.key === 'ArrowRight') moveRight = true;
    });
    document.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft') moveLeft = false;
      if (e.key === 'ArrowRight') moveRight = false;
    });

    // Touch Controls
    let startX = null;
    window.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
    });
    window.addEventListener('touchend', e => {
      const endX = e.changedTouches[0].clientX;
      const delta = endX - startX;
      if (delta > 30) {
        moveRight = true;
        setTimeout(() => moveRight = false, 100);
      } else if (delta < -30) {
        moveLeft = true;
        setTimeout(() => moveLeft = false, 100);
      }
    });

    camera.position.y = 5;
    camera.lookAt(0, 0, -5);

    let lastSpawn = 0;
    let gameOver = false;
    let score = 0;

    const scoreElem = document.getElementById('score');
    const gameOverElem = document.getElementById('gameOver');
    const restartBtn = document.getElementById('restartBtn');
    restartBtn.onclick = () => window.location.reload();

    function animate(time) {
      if (gameOver) return;
      requestAnimationFrame(animate);
      const t = time * 0.001;

      if (t - lastSpawn > 1) {
        spawnObstacle();
        lastSpawn = t;
        score++;
        scoreElem.textContent = score;
      }

      if (moveLeft) player.position.x -= 0.1;
      if (moveRight) player.position.x += 0.1;

      for (let i = 0; i < obstacles.length; i++) {
        const o = obstacles[i];
        o.position.y -= 0.1;

        if (o.position.y < -5) {
          scene.remove(o);
          obstacles.splice(i, 1);
          i--;
          continue;
        }

        const dx = Math.abs(o.position.x - player.position.x);
        const dy = Math.abs(o.position.y - player.position.y);
        if (dx < 1 && dy < 1) {
          gameOver = true;
          gameOverElem.style.display = 'block';
          return;
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
